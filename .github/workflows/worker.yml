name: Deploy worker

# Uploads worker/worker.js to Cloudflare whenever it changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers
# template) and CLOUDFLARE_ACCOUNT_ID. The existing KV binding and secrets
# (LIMITS, ELEVENLABS_KEY, ANTHROPIC_KEY) are kept as they are.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          ACCOUNT=$(printf %s "$ACCOUNT" | tr -dc "a-f0-9"); TOKEN=$(printf %s "$TOKEN" | tr -d "[:space:]")
          echo "account id length: ${#ACCOUNT}"
          echo '{"main_module":"worker.js","compatibility_date":"2024-11-01","keep_bindings":["kv_namespace","secret_text","plain_text"]}' > metadata.json
          curl -sS --fail-with-body -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/voice-trip" \
            -H "Authorization: Bearer $TOKEN" \
            -F "metadata=@metadata.json;type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module" \
            | jq -c '{success, errors, id: .result.id, etag: .result.etag}' | tee r.json
          cp r.json /tmp/upload.json
      - name: Check the live worker
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 5
          ACCOUNT=$(printf %s "$ACCOUNT" | tr -dc "a-f0-9"); TOKEN=$(printf %s "$TOKEN" | tr -d "[:space:]")
          echo "account id length: ${#ACCOUNT}"
          exec > >(tee /tmp/diag.txt) 2>&1
          echo upload: $(cat /tmp/upload.json)
          A="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers"
          echo "::notice title=scripts::$(curl -sS "$A/scripts" -H "Authorization: Bearer $TOKEN" | jq -c '[.result[]?|.id+" "+.modified_on] , .errors' | tr '\n' ' ' | head -c 600)"
          echo "::notice title=subdomain::$(curl -sS "$A/subdomain" -H "Authorization: Bearer $TOKEN" | jq -c '.result,.errors' | tr '\n' ' ' | head -c 300)"
          echo "::notice title=live-code::$(curl -sS "$A/scripts/voice-trip/content/v2" -H "Authorization: Bearer $TOKEN" | head -c 200 | tr "\n" " ")"
          B=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/voice-trip/settings" -H "Authorization: Bearer $TOKEN" | jq -c '[.result.bindings[]?|.type+":"+.name], .errors' | tr '\n' ' ')
          echo "::notice title=bindings::$B"
          O='Origin: https://eqht98-dotcom.github.io'
          C=$(curl -sS -H "$O" -w ' %{http_code}' https://voice-trip.eqht98.workers.dev/credits | head -c 300)
          echo "::notice title=credits::$C"
          S=$(curl -sS -H "$O" -H 'content-type: application/json' -X POST -d 'x' -w ' %{http_code}' https://voice-trip.eqht98.workers.dev/sync | head -c 300)
          echo "::notice title=sync::$S"
      - name: Save the checks to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag && git rm -rfq . && cp /tmp/diag.txt diag.txt && git add diag.txt && git commit -qm diag && git push -qf origin diag
