name: Fetch country clips
# Runs when clips/queries.json changes on a branch other than main, fetches the clips from Pexels
# and commits them back to that branch for review before merging.
on:
  push:
    branches-ignore: [main]
    paths: [clips/queries.json, tools/fetch_clips.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch and prepare clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ONLY: ""
        run: python3 tools/fetch_clips.py
      - name: Commit clips
        run: |
          git config user.name "clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clips
          git commit -m "Add country clips from Pexels" || echo "nothing to commit"
          git push
