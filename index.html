<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة حول العالم بصوتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1726;--bg2:#13223a;--card:#182a45;--line:#26406a;
  --ink:#f5efe3;--muted:#9db0cb;--gold:#e9b949;--gold2:#f6d58a;
  --red:#ef5350;--green:#4cc38a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#1f3a63 0%,transparent 60%),var(--bg);
  color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand .globe{font-size:34px}
.brand h1{margin:0;font-size:clamp(20px,2.6vw,30px);font-weight:700}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.tools{display:flex;gap:10px;align-items:center}
.pill{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px}
.iconbtn{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 20px 40px;gap:22px;width:100%;max-width:1100px;margin:0 auto}

/* stage 1 */
.readbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 26px;max-width:820px;width:100%;text-align:center}
.readbox .label{color:var(--gold);font-weight:600;font-size:14px;letter-spacing:.3px;margin-bottom:8px}
.readbox p{margin:0;font-size:clamp(20px,2.4vw,28px);line-height:1.9}
.consent{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:16px;cursor:pointer;user-select:none}
.consent input{width:22px;height:22px;accent-color:var(--gold)}

.recwrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.recbtn{
  width:170px;height:170px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ff7a75,var(--red) 60%,#b52f2c);
  color:#fff;font-family:inherit;font-size:22px;font-weight:700;
  box-shadow:0 12px 40px rgba(239,83,80,.35);transition:transform .15s;
}
.recbtn:hover{transform:scale(1.03)}
.recbtn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none}
.recbtn.recording{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,83,80,.55)}50%{box-shadow:0 0 0 22px rgba(239,83,80,0)}}
.timer{font-size:18px;color:var(--muted);min-height:26px;text-align:center}

/* processing */
.status{display:none;flex-direction:column;align-items:center;gap:14px;padding:30px 0}
.plane{font-size:64px;animation:fly 2.4s ease-in-out infinite}
@keyframes fly{0%{transform:translateX(60px) rotate(-8deg)}50%{transform:translateX(-60px) rotate(4deg)}100%{transform:translateX(60px) rotate(-8deg)}}
.status h2{margin:0;font-size:28px}
.status p{margin:0;color:var(--muted)}

/* results */
.results{display:none;width:100%;flex-direction:column;align-items:center;gap:18px}
.results h2{margin:0;font-size:clamp(24px,3vw,34px);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:100%}
.dest{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
  display:flex;flex-direction:column;gap:10px;min-height:190px;overflow:hidden;
}
.dest .top{display:flex;align-items:center;gap:10px}
.dest .flag{font-size:38px;line-height:1}
.dest .country{font-weight:700;font-size:20px}
.dest .lang{color:var(--muted);font-size:13px}
.dest .text{direction:ltr;text-align:left;color:var(--ink);opacity:.85;font-size:15px;line-height:1.6;flex:1}
.dest .play{
  align-self:stretch;border:0;border-radius:12px;padding:12px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--gold);color:#1b1404;
}
.dest .play:disabled{background:var(--line);color:var(--muted);cursor:wait}
.dest.playing{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.dest.error .play{background:#3a2430;color:#ffb3b3}
.stamp{
  position:absolute;top:12px;left:12px;width:74px;height:74px;border-radius:50%;
  border:3px solid var(--red);color:var(--red);display:grid;place-items:center;text-align:center;
  font-size:11px;font-weight:700;line-height:1.2;transform:rotate(-14deg) scale(1.6);opacity:0;transition:all .35s cubic-bezier(.2,1.6,.4,1);
}
.dest.stamped .stamp{opacity:.9;transform:rotate(-14deg) scale(1)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;padding:12px 22px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.deleted{color:var(--green);font-size:15px}

/* error */
.err{display:none;max-width:760px;width:100%;background:#3a1e24;border:1px solid #7a2f3a;color:#ffd0d0;border-radius:16px;padding:14px 18px;font-size:15px;line-height:1.7}
.err code{direction:ltr;display:block;text-align:left;margin-top:6px;opacity:.75;font-size:12px;white-space:pre-wrap;word-break:break-word}

/* settings */
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:90vh}
.dlg h3{margin:0 0 4px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea{
  background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:15px
}
.field textarea{direction:ltr;text-align:left;min-height:54px;resize:vertical}
.field .ltr{direction:ltr;text-align:left}
.inline{display:flex;gap:10px;align-items:center}
.hint{color:var(--muted);font-size:13px;line-height:1.6}
.sep{height:1px;background:var(--line);margin:4px 0}
.mini{font-size:14px;padding:8px 14px}
.log{direction:ltr;text-align:left;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px}
@media (max-width:600px){header{padding:14px 16px}.recwrap{width:180px;height:180px}.recbtn{width:140px;height:140px;font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="globe">🌍</span>
    <h1>رحلة حول العالم بصوتك<small>يوم الطلاب العالمي</small></h1>
  </div>
  <div class="tools">
    <span class="pill" id="credits" title="الرصيد المتبقي">—</span>
    <button class="iconbtn" id="openSettings" title="الإعدادات (للمنظمين)">⚙️</button>
  </div>
</header>

<main>
  <!-- STAGE: record -->
  <section id="stageRecord" style="display:contents">
    <div class="readbox">
      <div class="label">اقرأ هذا النص بصوت واضح 🎙️</div>
      <p id="readText"></p>
    </div>
    <label class="consent"><input type="checkbox" id="consent"> أوافق على نسخ صوتي مؤقتاً، ويُحذف فوراً بعد التجربة</label>
    <div class="recwrap">
      <svg class="ring" viewBox="0 0 220 220"><circle class="bgc" cx="110" cy="110" r="100"/><circle class="fg" id="ringFg" cx="110" cy="110" r="100"/></svg>
      <button class="recbtn" id="recBtn" disabled>اضغط وسجّل</button>
    </div>
    <div class="timer" id="timer">علّم الموافقة أولاً</div>
    <button class="btn" id="altRec" hidden>🎙️ سجّل بتطبيق التسجيل في الجهاز</button>
    <input type="file" id="altFile" accept="audio/*" capture hidden>
  </section>

  <!-- STAGE: processing -->
  <section class="status" id="stageWork">
    <div class="plane">✈️</div>
    <h2 id="workTitle">جاري تجهيز رحلتك…</h2>
    <p id="workSub">ننسخ صوتك الحين</p>
  </section>

  <!-- STAGE: results -->
  <section class="results" id="stageResults">
    <h2>اسمع نفسك حول العالم 🌏</h2>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="btn primary" id="playAll">▶ شغّل الرحلة كاملة</button>
      <button class="btn" id="newVisitor">زائر جديد ↺</button>
    </div>
    <div class="deleted" id="deletedNote"></div>
  </section>

  <div class="err" id="err"></div>
</main>

<dialog id="settings">
  <div class="dlg">
    <h3>⚙️ إعدادات المنظمين</h3>
    <div class="field">
      <label>مفتاح ElevenLabs API</label>
      <div class="inline"><input type="password" id="sKey" class="ltr" style="flex:1" placeholder="sk_..."><button class="btn mini" id="testKey">اختبار</button></div>
      <div class="hint" id="keyStatus">المفتاح يُحفظ في هذا المتصفح فقط.</div>
    </div>
    <div class="inline">
      <div class="field" style="flex:1"><label>مدة التسجيل (ثانية)</label><input type="number" id="sSecs" min="10" max="90"></div>
      <div class="field" style="flex:2"><label>الموديل (model_id)</label><input type="text" id="sModel" class="ltr"></div>
    </div>
    <div class="inline">
      <div class="field" style="flex:1"><label>Similarity: <b id="vSim"></b></label><input type="range" id="sSim" min="0" max="1" step="0.05"></div>
      <div class="field" style="flex:1"><label>Stability: <b id="vStab"></b></label><input type="range" id="sStab" min="0" max="1" step="0.05"></div>
    </div>
    <label class="consent"><input type="checkbox" id="sNoise"> إزالة الضوضاء من التسجيل (أنصح فيها في البوث)</label>
    <div class="sep"></div>
    <div class="field"><label>النص العربي اللي يقرأه الزائر</label><textarea id="sRead" style="direction:rtl;text-align:right;min-height:90px"></textarea></div>
    <div id="langFields"></div>
    <div class="sep"></div>
    <div class="row" style="justify-content:flex-start">
      <button class="btn mini" id="cleanup">🧹 احذف كل أصوات الزوار المتبقية</button>
      <button class="btn mini" id="resetTexts">إرجاع النصوص الافتراضية</button>
    </div>
    <div class="log" id="log"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="saveSettings">حفظ وإغلاق</button></div>
  </div>
</dialog>

<script>
const API = 'https://api.elevenlabs.io/v1';
const PREFIX = 'StudentDay-';

const DEFAULT_READ = 'السلام عليكم، أنا اليوم في يوم الطلاب العالمي، وجاي أسافر حول العالم في ثلاثين ثانية. أبي أشوف اليابان والصين وبريطانيا وإسبانيا، وأسمع نفسي أتكلم لغاتهم. يقولون اللغة مفتاح الثقافة، واليوم بجرب هالمفتاح بصوتي أنا. يلا نبدأ الرحلة!';
const DEFAULT_LANGS = [
  {flag:'🇬🇧', country:'بريطانيا', lang:'English',  stamp:'LONDON',  text:"Hello everyone! I'm in London today, travelling around the world on Student Day."},
  {flag:'🇯🇵', country:'اليابان',  lang:'日本語',    stamp:'TOKYO',   text:'みなさん、こんにちは！今日は東京にいます。学生の日に世界を旅しています。'},
  {flag:'🇨🇳', country:'الصين',    lang:'中文',      stamp:'BEIJING', text:'大家好！我今天在北京，正在学生日环游世界。'},
  {flag:'🇪🇸', country:'إسبانيا',  lang:'Español',  stamp:'MADRID',  text:'¡Hola a todos! Hoy estoy en Madrid, viajando por el mundo en el Día del Estudiante.'},
];
const FALLBACK_MODEL = 'eleven_multilingual_v2';
const CFG_VER = 2;
const DEFAULTS = {ver:CFG_VER, key:'', secs:30, model:'eleven_v3', sim:1, stab:0.5, noise:true, read:DEFAULT_READ, langs:DEFAULT_LANGS, pending:[]};

let cfg = loadCfg();
function loadCfg(){
  let c = {};
  try { c = JSON.parse(localStorage.getItem('voiceTripCfg')) || {}; } catch(e) {}
  const merged = Object.assign({}, DEFAULTS, c);
  if (!Array.isArray(merged.langs) || merged.langs.length === 0) merged.langs = DEFAULT_LANGS;
  if (!Array.isArray(merged.pending)) merged.pending = [];
  if ((c.ver||1) < CFG_VER){ merged.model = DEFAULTS.model; merged.sim = DEFAULTS.sim; merged.stab = DEFAULTS.stab; merged.ver = CFG_VER; }
  return merged;
}
function saveCfg(){ try { localStorage.setItem('voiceTripCfg', JSON.stringify(cfg)); } catch(e) {} }

const $ = id => document.getElementById(id);
const logLines = [];
function log(msg){ logLines.push(new Date().toLocaleTimeString()+'  '+msg); $('log').textContent = logLines.slice(-40).join('\n'); }

/* ---------- UI helpers ---------- */
function show(stage){
  $('stageRecord').style.display = stage==='record' ? 'contents' : 'none';
  $('stageWork').style.display = stage==='work' ? 'flex' : 'none';
  $('stageResults').style.display = stage==='results' ? 'flex' : 'none';
}
function showErr(msg, detail){
  const e = $('err');
  e.innerHTML = '⚠️ ' + msg + (detail ? '<code>'+String(detail).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</code>' : '');
  e.style.display = 'block';
}
function clearErr(){ $('err').style.display='none'; }
function work(title, sub){ $('workTitle').textContent = title; $('workSub').textContent = sub || ''; }

const R = 100, CIRC = 2*Math.PI*R;
$('ringFg').style.strokeDasharray = CIRC;
function setRing(frac){ $('ringFg').style.strokeDashoffset = CIRC*(1-frac); }
setRing(0);

$('readText').textContent = cfg.read;
$('consent').addEventListener('change', () => {
  $('recBtn').disabled = !$('consent').checked;
  $('timer').textContent = $('consent').checked ? 'جاهز؟ اضغط الزر وابدأ القراءة' : 'علّم الموافقة أولاً';
});

/* ---------- API ---------- */
async function api(path, opts={}){
  if (!cfg.key) throw new Error('NO_KEY');
  const headers = Object.assign({'xi-api-key': cfg.key}, opts.headers||{});
  let r;
  try { r = await fetch(API+path, Object.assign({}, opts, {headers})); }
  catch(e){ throw new Error('NETWORK: '+e.message); }
  if (!r.ok){
    let t=''; try { t = await r.text(); } catch(e){}
    throw new Error('HTTP '+r.status+': '+t.slice(0,400));
  }
  return r;
}
async function refreshCredits(){
  if (!cfg.key){ $('credits').textContent='بدون مفتاح'; return; }
  try {
    const s = await (await api('/user/subscription')).json();
    const left = (s.character_limit ?? 0) - (s.character_count ?? 0);
    $('credits').textContent = 'الرصيد: ' + left.toLocaleString('en-US');
  } catch(e){ $('credits').textContent='—'; log('credits: '+e.message); }
}
async function deleteVoice(id){
  try { await api('/voices/'+id, {method:'DELETE'}); log('deleted '+id); cfg.pending = cfg.pending.filter(x=>x!==id); saveCfg(); return true; }
  catch(e){ log('delete failed '+id+': '+e.message); if(!cfg.pending.includes(id)){cfg.pending.push(id); saveCfg();} return false; }
}
async function retryPending(){
  for (const id of [...cfg.pending]) await deleteVoice(id);
}

/* ---------- Recording ---------- */
let mediaRec=null, stream=null, chunks=[], t0=0, tick=null, recording=false;

$('recBtn').addEventListener('click', async () => {
  clearErr();
  if (recording){ stopRec(); return; }
  if (!cfg.key){ showErr('ما فيه مفتاح API. افتح الإعدادات ⚙️ وحط المفتاح.'); $('settings').showModal(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ enableAlt(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:true, channelCount:1}});
  } catch(e){ log('mic: '+e.message); enableAlt(); return; }
  chunks = [];
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec.start(250);
  recording = true; t0 = performance.now();
  $('recBtn').classList.add('recording'); $('recBtn').textContent = 'إيقاف';
  $('consent').disabled = true;
  tick = setInterval(() => {
    const el = (performance.now()-t0)/1000;
    const left = Math.max(0, cfg.secs - el);
    setRing(Math.min(1, el/cfg.secs));
    $('timer').textContent = el < 10 ? `🔴 تسجيل… ${Math.ceil(left)} ث (أقل شي 10 ثواني)` : `🔴 تسجيل… ${Math.ceil(left)} ث`;
    if (el >= cfg.secs) stopRec();
  }, 100);
});

/* Fallback: the browser blocks the mic (e.g. file opened from Downloads on Android) -> use the device's recorder app */
let altMode = false;
function enableAlt(){
  altMode = true;
  document.querySelector('.recwrap').style.display='none';
  $('altRec').hidden = false; $('altRec').classList.add('primary'); $('altRec').style.fontSize='20px'; $('altRec').style.padding='18px 30px';
  $('altRec').disabled = !$('consent').checked;
  $('timer').textContent = 'المتصفح منع المايك هنا. اضغط الزر تحت، وسجّل النص في تطبيق التسجيل، وبعدها ارجع.';
}
$('consent').addEventListener('change', ()=>{ if (altMode) $('altRec').disabled = !$('consent').checked; });
$('altRec').addEventListener('click', ()=>{ clearErr(); if (!cfg.key){ $('settings').showModal(); return; } $('altFile').value=''; $('altFile').click(); });
$('altFile').addEventListener('change', async ()=>{
  const f = $('altFile').files && $('altFile').files[0];
  if (!f) return;
  show('work'); work('جاري تجهيز رحلتك…', 'نجهّز التسجيل');
  let wav = f, dur = null;
  try { wav = await toWav(f); dur = (wav.size-44)/2/ (await sampleRateOf(wav)); } catch(e){ log('alt convert failed, sending raw: '+e.message); }
  if (dur !== null && dur < 10){ show('record'); resetRecordUI(); showErr('التسجيل قصير. لازم 10 ثواني على الأقل.'); return; }
  runTrip(wav);
});
async function sampleRateOf(wavBlob){ const b = await wavBlob.slice(24,28).arrayBuffer(); return new DataView(b).getUint32(0,true); }

function stopRec(){
  if (!recording) return;
  recording = false; clearInterval(tick);
  try { mediaRec.stop(); } catch(e){}
  $('recBtn').classList.remove('recording');
}

async function onRecStop(){
  const dur = (performance.now()-t0)/1000;
  stream && stream.getTracks().forEach(t=>t.stop());
  if (dur < 10){
    resetRecordUI();
    showErr('التسجيل قصير. لازم 10 ثواني على الأقل، ويفضّل تكمل النص كامل.');
    return;
  }
  const blob = new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'});
  show('work'); work('جاري تجهيز رحلتك…', 'نجهّز التسجيل');
  let wav;
  try { wav = await toWav(blob); }
  catch(e){ log('wav convert failed, sending raw: '+e.message); wav = blob; }
  runTrip(wav);
}

async function toWav(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const buf = await ac.decodeAudioData(await blob.arrayBuffer());
  const n = buf.length, sr = buf.sampleRate, ch = buf.numberOfChannels;
  const mono = new Float32Array(n);
  for (let c=0;c<ch;c++){ const d = buf.getChannelData(c); for (let i=0;i<n;i++) mono[i] += d[i]/ch; }
  ac.close && ac.close();
  const out = new DataView(new ArrayBuffer(44 + n*2));
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) out.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); out.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt ');
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
  out.setUint32(24,sr,true); out.setUint32(28,sr*2,true); out.setUint16(32,2,true); out.setUint16(34,16,true);
  w(36,'data'); out.setUint32(40,n*2,true);
  for (let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,mono[i])); out.setInt16(44+i*2, s<0?s*0x8000:s*0x7fff, true); }
  return new Blob([out], {type:'audio/wav'});
}

/* ---------- The trip ---------- */
let players = [];

async function runTrip(sample){
  let voiceId = null;
  try {
    work('جاري تجهيز رحلتك…', 'ننسخ صوتك الحين 🎙️');
    const fd = new FormData();
    fd.append('name', PREFIX + new Date().toISOString().replace(/[:.]/g,'-'));
    fd.append('description', 'Temporary Student Day booth voice - auto deleted');
    fd.append('remove_background_noise', cfg.noise ? 'true' : 'false');
    fd.append('files', sample, sample.type==='audio/wav' ? 'sample.wav' : (sample.name || 'sample.webm'));
    const res = await (await api('/voices/add', {method:'POST', body:fd})).json();
    voiceId = res.voice_id;
    cfg.pending.push(voiceId); saveCfg();
    log('cloned '+voiceId);

    buildCards();
    show('results');
    $('deletedNote').textContent = '⏳ نجهّز المحطات…';

    // generate 2 at a time, show each as it arrives
    const queue = cfg.langs.map((l,i)=>i);
    const worker = async () => { while(queue.length){ const i = queue.shift(); await genOne(voiceId, i); } };
    await Promise.all([worker(), worker()]);
  } catch(e){
    log('trip error: '+e.message);
    show('record'); resetRecordUI();
    showErr(friendly(e), e.message);
  } finally {
    if (voiceId){
      const ok = await deleteVoice(voiceId);
      $('deletedNote').textContent = ok ? '🗑️ تم حذف نسخة صوتك من النظام' : '⚠️ ما انحذف الصوت تلقائياً. احذفه من الإعدادات (زر 🧹)';
    }
    refreshCredits();
  }
}

function friendly(e){
  const m = e.message || '';
  if (m === 'NO_KEY') return 'ما فيه مفتاح API. افتح الإعدادات ⚙️.';
  if (m.startsWith('NETWORK')) return 'ما قدرنا نتصل بـ ElevenLabs. تأكد من الإنترنت. لو الإنترنت شغال، يمكن المتصفح يمنع الاتصال من هذا الملف (أرسل لـ Claude رسالة الخطأ تحت).';
  if (m.includes('401')) return 'مفتاح API غير صحيح أو ما عنده صلاحيات كافية.';
  if (m.includes('quota') || m.includes('credits')) return 'الرصيد خلص أو ما يكفي.';
  if (m.includes('voice_limit') || m.includes('maximum amount of custom voices')) return 'وصلت للحد الأعلى من الأصوات. اضغط 🧹 في الإعدادات عشان تحذف الأصوات القديمة.';
  if (m.includes('429')) return 'طلبات كثيرة بنفس الوقت. انتظر ثواني وجرب مرة ثانية.';
  return 'صار خطأ. جرّب مرة ثانية.';
}

function buildCards(){
  const g = $('grid'); g.innerHTML=''; players = [];
  cfg.langs.forEach((l,i)=>{
    const d = document.createElement('div'); d.className='dest'; d.id='dest'+i;
    d.innerHTML = `<div class="stamp">${l.stamp||''}<br>✓</div>
      <div class="top"><span class="flag">${l.flag}</span><div><div class="country">${l.country}</div><div class="lang">${l.lang}</div></div></div>
      <div class="text"></div>
      <button class="play" disabled>⏳ جاري التجهيز…</button>`;
    d.querySelector('.text').textContent = l.text;
    d.querySelector('.play').addEventListener('click', ()=>playOne(i));
    g.appendChild(d);
  });
}

async function genOne(voiceId, i){
  const l = cfg.langs[i], d = $('dest'+i), b = d.querySelector('.play');
  const call = model => api(`/text-to-speech/${voiceId}?output_format=mp3_44100_128`, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'audio/mpeg'},
      body: JSON.stringify({text:l.text, model_id:model, voice_settings:{stability:+cfg.stab, similarity_boost:+cfg.sim, use_speaker_boost:true}})
    });
  try {
    let r;
    try { r = await call(cfg.model); }
    catch(e){
      if (cfg.model !== FALLBACK_MODEL && /HTTP 4(00|22|04)/.test(e.message)){ log('model '+cfg.model+' failed, falling back: '+e.message); r = await call(FALLBACK_MODEL); }
      else throw e;
    }
    const url = URL.createObjectURL(await r.blob());
    players[i] = new Audio(url);
    b.disabled = false; b.textContent = '▶ اسمع';
  } catch(e){
    log('tts '+i+' failed: '+e.message);
    d.classList.add('error'); b.textContent = '✕ ما زبطت'; b.disabled = true;
  }
}

function stopAll(){ players.forEach(p=>{ if(p){p.pause(); p.currentTime=0;} }); document.querySelectorAll('.dest').forEach(d=>d.classList.remove('playing')); }
function playOne(i){
  return new Promise(res=>{
    const p = players[i]; if(!p) return res();
    stopAll();
    const d = $('dest'+i); d.classList.add('playing');
    p.onended = ()=>{ d.classList.remove('playing'); d.classList.add('stamped'); res(); };
    p.onerror = ()=>{ d.classList.remove('playing'); res(); };
    p.play().catch(()=>res());
  });
}
$('playAll').addEventListener('click', async ()=>{ for (let i=0;i<cfg.langs.length;i++){ await playOne(i); await new Promise(r=>setTimeout(r,350)); } });

$('newVisitor').addEventListener('click', ()=>{
  stopAll(); players.forEach(p=>p && URL.revokeObjectURL(p.src)); players=[];
  $('grid').innerHTML=''; $('deletedNote').textContent='';
  clearErr(); resetRecordUI(); show('record');
});

function resetRecordUI(){
  setRing(0);
  $('recBtn').textContent='اضغط وسجّل'; $('recBtn').classList.remove('recording');
  $('consent').disabled=false; $('consent').checked=false; $('recBtn').disabled=true;
  $('timer').textContent='علّم الموافقة أولاً';
  if (altMode){ $('altRec').disabled = true; $('timer').textContent = 'علّم الموافقة، وبعدها سجّل بتطبيق التسجيل'; }
}

/* ---------- Settings ---------- */
function renderLangFields(){
  const box = $('langFields'); box.innerHTML='';
  cfg.langs.forEach((l,i)=>{
    const f = document.createElement('div'); f.className='field';
    f.innerHTML = `<label>${l.flag} ${l.country}</label><textarea data-i="${i}"></textarea>`;
    f.querySelector('textarea').value = l.text;
    box.appendChild(f);
  });
}
function fillSettings(){
  $('sKey').value = cfg.key; $('sSecs').value = cfg.secs; $('sModel').value = cfg.model;
  $('sSim').value = cfg.sim; $('sStab').value = cfg.stab; $('sNoise').checked = !!cfg.noise;
  $('vSim').textContent = Math.round(cfg.sim*100)+'%'; $('vStab').textContent = Math.round(cfg.stab*100)+'%';
  $('sRead').value = cfg.read; renderLangFields();
}
function readSettings(){
  cfg.key = $('sKey').value.trim();
  cfg.secs = Math.min(90, Math.max(10, parseInt($('sSecs').value)||30));
  cfg.model = $('sModel').value.trim() || DEFAULTS.model;
  cfg.sim = +$('sSim').value; cfg.stab = +$('sStab').value; cfg.noise = $('sNoise').checked;
  cfg.read = $('sRead').value.trim() || DEFAULT_READ;
  document.querySelectorAll('#langFields textarea').forEach(t=>{ cfg.langs[+t.dataset.i] = Object.assign({}, cfg.langs[+t.dataset.i], {text:t.value.trim()}); });
}
$('sSim').addEventListener('input', e=>$('vSim').textContent=Math.round(e.target.value*100)+'%');
$('sStab').addEventListener('input', e=>$('vStab').textContent=Math.round(e.target.value*100)+'%');
$('openSettings').addEventListener('click', ()=>{ fillSettings(); $('settings').showModal(); });
$('saveSettings').addEventListener('click', ()=>{ readSettings(); saveCfg(); $('readText').textContent = cfg.read; $('settings').close(); refreshCredits(); });
$('resetTexts').addEventListener('click', ()=>{ cfg.read = DEFAULT_READ; cfg.langs = JSON.parse(JSON.stringify(DEFAULT_LANGS)); fillSettings(); });
$('testKey').addEventListener('click', async ()=>{
  readSettings(); saveCfg();
  $('keyStatus').textContent = '…جاري الاختبار';
  try {
    const s = await (await api('/user/subscription')).json();
    const left = (s.character_limit ?? 0) - (s.character_count ?? 0);
    $('keyStatus').textContent = `✅ المفتاح شغال. الباقة: ${s.tier||'?'} · الرصيد: ${left.toLocaleString('en-US')}`;
    refreshCredits();
  } catch(e){ $('keyStatus').textContent = '❌ ' + friendly(e) + '  (' + e.message.slice(0,120) + ')'; }
});
$('cleanup').addEventListener('click', async ()=>{
  readSettings(); saveCfg();
  try {
    const data = await (await api('/voices')).json();
    const mine = (data.voices||[]).filter(v => (v.name||'').startsWith(PREFIX));
    log('found '+mine.length+' visitor voices');
    for (const v of mine) await deleteVoice(v.voice_id);
    await retryPending();
    log('cleanup done');
  } catch(e){ log('cleanup failed: '+e.message); }
});

show('record');
refreshCredits();
retryPending();
</script>
</body>
</html>
